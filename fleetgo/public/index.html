<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FleetGo</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1c1f24; --muted:#5f6670; --accent:#1f6feb; --ok:#1a7f37; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1115; --card:#181b21; --text:#e8eaed; --muted:#9aa1ab; --accent:#4c8dff; --ok:#3fb950; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background:var(--bg); color:var(--text); min-height:100vh;
           display:flex; align-items:center; justify-content:center; padding:16px; }
    .card { background:var(--card); border-radius:16px; padding:32px; max-width:520px; width:100%;
            box-shadow:0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06); }
    h1 { margin:0 0 4px; font-size:32px; }
    h1 span { color:var(--accent); }
    p { color:var(--muted); line-height:1.6; margin:8px 0 0; }
    .status { margin-top:24px; display:flex; align-items:center; gap:8px; font-weight:600; }
    .dot { width:10px; height:10px; border-radius:50%; background:var(--muted); }
    .dot.ok { background:var(--ok); }
    small { display:block; margin-top:16px; color:var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Fleet<span>Go</span></h1>
    <p>Trang mẫu đang chạy qua Cloudflare Tunnel tại <strong>fleetgo.cktfamily.com</strong>.
       Thay nội dung thư mục <code>public</code> bằng app thật khi sẵn sàng.</p>
    <div class="status"><span class="dot" id="dot"></span><span id="msg">Đang kiểm tra server…</span></div>
    <small id="time"></small>
  </main>
  <script>
    fetch("/api/health").then(r => r.json()).then(d => {
      document.getElementById("dot").classList.add("ok");
      document.getElementById("msg").textContent = "Server hoạt động bình thường";
      document.getElementById("time").textContent = "Giờ server: " + new Date(d.time).toLocaleString("vi-VN");
    }).catch(() => {
      document.getElementById("msg").textContent = "Không kết nối được server";
    });
  </script>
</body>
</html>
